<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>가위바위보 게임</title>
<!-- 41번: 화면 아래 시작 버튼·점수가 안 잘리게 (실제 보이는 높이에 맞춤, 손 그림 칸 줄임) · 게임에서 나가면 음악 꺼짐 · 점수는 계속 이어짐 -->
<!-- 40번: 한 판 승부가 나면 1.5초 뒤 저절로 다음 판 · 5초 안 누르면 3, 2, 1 세고 내 손이 저절로 나가요 -->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}
.w{height:100vh;height:100dvh;height:var(--vh,100dvh);max-width:520px;margin:0 auto;padding:1.5vh 3vw calc(1.5vh + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:1.2vh}
h1{text-align:center;font-size:min(4vh,30px);font-weight:900;position:relative}
.back{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:min(2.6vh,18px);color:#ccc;text-decoration:none;font-weight:700}
.arena{flex:1;min-height:0;background:#111;border-radius:22px;display:flex;flex-direction:column;justify-content:center;gap:1.5vh;padding:1vh 3vw;overflow:hidden}
.row{display:flex;align-items:center}
.row>.side{flex:1;text-align:center;font-size:min(2.8vh,21px);font-weight:900}
.win{color:#ffd84a}
.side small{display:block;font-size:min(2.8vh,21px);color:#aaa;font-weight:900}
.hand{font-size:min(9vh,22vw);line-height:1}
.cpu{transform:rotate(180deg)}
.shake{animation:sh .25s infinite alternate}
.cpu.shake{animation:shc .25s infinite alternate}
@keyframes sh{to{transform:translateY(-12px)}}
@keyframes shc{from{transform:rotate(180deg)}to{transform:rotate(180deg) translateY(-12px)}}
.mid{display:flex;flex-direction:column;align-items:center;gap:.8vh}
.pot{font-size:min(2.2vh,17px);font-weight:800;color:#ffd84a;background:#2a2410;border:2px solid #ffd84a;border-radius:20px;padding:2px 12px;transition:transform .8s ease-in,opacity .8s}
.big{font-size:min(5vh,40px);font-weight:900;font-style:italic;min-height:1.2em;text-align:center}
.vs{font-size:min(3vh,24px);font-weight:900;color:#444;font-style:italic}
.btns{display:flex;gap:2vw;align-items:stretch;flex:none;min-height:min(13vh,110px);margin-bottom:14px}
.me,.st{flex:0 0 26%;border-radius:16px}
.me{background:linear-gradient(#ff3b3b,#a01818);display:flex;flex-direction:column;justify-content:center;text-align:center;font-weight:900}
.me span{font-size:min(1.9vh,14px);opacity:.9}
.me b{font-size:min(4vh,30px);line-height:1.1}
.hs{flex:1;display:flex;gap:3px}
.hs button{flex:1;background:#1c1c1c;border:2px solid #333;border-radius:14px;color:#fff;font-size:min(2.1vh,16px);font-weight:700;padding:.6vh 0}
.hs button i{font-style:normal;font-size:min(4.8vh,36px);display:block}
.hs button:disabled{opacity:.35}
.hs button:not(:disabled){border-color:#ff3b3b}
.st{display:flex;flex-direction:column;gap:4px}
.bets{display:flex;gap:3px}
.bets button{flex:1;background:#1c1c1c;border:2px solid #555;border-radius:20px;color:#ddd;font-size:min(1.9vh,14px);font-weight:800;padding:3px 0}
.bets button.on{background:#ffd84a;border-color:#ffd84a;color:#000}
.bets button:disabled{opacity:.4}
.bets .pr{flex:1;text-align:center;font-size:min(1.9vh,14px);color:#888;padding:3px 0}
.go{flex:1;background:#ff3b3b;border:0;border-radius:14px;color:#fff;font-size:min(2.8vh,21px);font-weight:900}
.go:disabled{opacity:.35}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh}
.ov h2{font-size:min(4.5vh,34px)}
.ov button{width:70%;max-width:320px;padding:2.2vh 0;border-radius:20px;border:0;font-size:min(3.4vh,26px);font-weight:900;color:#fff;background:#ff3b3b}
.ov button+button{background:#333}
.mk{position:fixed;right:6px;bottom:2px;font-size:10px;color:#555}
</style></head><body>
<div class="w">
 <h1><a class="back" id="back" href="index.html">‹ 돌아가기</a>가위바위보 게임</h1>
 <div class="arena">
  <div class="row"><div class="side win" id="ow">0승</div><div class="hand cpu" id="c">✊</div><div class="side" id="on">상대<small id="op"></small></div></div>
  <div class="mid"><div class="pot" id="pot" style="visibility:hidden"></div><div class="vs">VS</div><div class="big" id="big"></div></div>
  <div class="row"><div class="side win" id="mw">0승</div><div class="hand" id="m">✊</div><div class="side">나</div></div>
 </div>
 <div class="btns">
  <div class="me"><span>내 점수</span><b id="pt">500</b></div>
  <div class="hs">
   <button onclick="pick(0)" disabled><i>✌️</i>가위</button>
   <button onclick="pick(1)" disabled><i>✊</i>바위</button>
   <button onclick="pick(2)" disabled><i>🖐️</i>보</button>
  </div>
  <div class="st">
   <div class="bets" id="bets"></div>
   <button class="go" id="go" onclick="start()">시작</button>
  </div>
 </div>
</div>
<div class="ov" id="ov">
 <h2>누구랑 할까요?</h2>
 <button onclick="enter('friend')">친구랑 하기</button>
 <button onclick="enter('solo')">혼자 하기 (연습)</button>
</div>
<div class="mk">69KYM</div>
<script>
/* 41번: 폰 아래 버튼줄에 안 가리게 - 실제로 보이는 높이로 맞춰요 */
function fitH(){const h=(window.visualViewport&&visualViewport.height)||innerHeight;document.documentElement.style.setProperty('--vh',h+'px')}
fitH();addEventListener('resize',fitH);if(window.visualViewport)visualViewport.addEventListener('resize',fitH);
const H=['✌️','✊','🖐️'],$=x=>document.getElementById(x),HB=[...document.querySelectorAll('.hs button')];
/* 소리: sound 폴더에 아래 이름으로 mp3를 올리면 나와요 */
const SND={bgm:'sound/bgm.mp3',hello:'sound/hello.mp3',gbb:'sound/gawibawibo.mp3',assa:'sound/assa.mp3',ayu:'sound/ayu.mp3',win3:'sound/win3.mp3'};
for(const k in SND){SND[k]=new Audio(SND[k])}
SND.bgm.loop=true;SND.bgm.volume=.35;
/* 41번: 게임에서 나가면 음악·소리 모두 끄기 */
function stopAll(){for(const k in SND){try{SND[k].pause();SND[k].currentTime=0}catch(e){}}}
addEventListener('pagehide',stopAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll();else if(mode&&$('ov').style.display==='none'){try{const p=SND.bgm.play();if(p)p.catch(()=>{})}catch(e){}}});
$('back').addEventListener('click',stopAll);
function snd(k){try{const a=SND[k];a.currentTime=0;const p=a.play();if(p)p.catch(()=>{})}catch(e){}}

let mode='solo',pt=500,op=500,bet=20,on=false,ws={m:0,o:0};
try{const v=localStorage.getItem('rp-point');if(v!==null)pt=+v}catch(e){}
function addDelta(n){try{localStorage.setItem('rp-point-delta',+(localStorage.getItem('rp-point-delta')||0)+n)}catch(e){}}   // 41번: 뽑기 게임 점수와 합쳐져요
function save(){$('pt').textContent=pt;$('op').textContent=mode==='friend'?op+'점':'';try{localStorage.setItem('rp-point',pt)}catch(e){}}
function showWins(){$('mw').textContent=ws.m+'승';$('ow').textContent=ws.o+'승'}
function drawBets(){
  $('bets').innerHTML=mode==='solo'?'<div class="pr">연습</div>':
    [20,50,100].map(n=>`<button class="${n===bet?'on':''}" ${on?'disabled':''} onclick="setBet(${n})">${n}</button>`).join('');
}
function setBet(n){bet=n;drawBets()}
function enter(md){
  mode=md;$('ov').style.display='none';
  $('on').firstChild.textContent=md==='solo'?'컴퓨터':'친구';
  snd('bgm');setTimeout(()=>snd('hello'),400);
  $('big').textContent='누가 이기나 해 보자!';$('big').style.color='#fff';
  drawBets();save();showWins();
}
function start(){
  if(!on){
    if(mode==='friend'){
      const b=Math.min(bet,pt,op);   // 연습용: 둘 중 적게 건 점수로 (지금은 상대도 같은 점수를 건다고 봐요)
      if(b<20){$('big').textContent='점수가 부족해요';return}
      bet=b;pt-=bet;op-=bet;addDelta(-bet);save();
      const p=$('pot');p.style.transition='none';p.style.transform='';p.style.opacity=1;p.textContent='판돈 '+bet*2;p.style.visibility='visible';
    }
    on=true;ws={m:0,o:0};showWins();drawBets();
  }
  round();
}
function round(){
  $('go').disabled=true;
  $('m').textContent=$('c').textContent='✊';
  $('m').classList.add('shake');$('c').classList.add('shake');
  const b=$('big');b.style.color='#fff';snd('gbb');
  const w=['가위','가위 바위','가위 바위 보!'];let i=0;
  const step=()=>{b.textContent=w[i];if(++i<3)setTimeout(step,500);else{HB.forEach(x=>x.disabled=false);waitPick()}};step();
}
let autoT=0;
function waitPick(){   // 5초 안 누르면 3, 2, 1 → 저절로
  clearTimeout(autoT);let n=8;
  const tick=()=>{if(HB[0].disabled)return;n--;
    if(n>3){autoT=setTimeout(tick,1000);return}
    if(n>0){const b=$('big');b.textContent=n+'';b.style.color='#ffd84a';autoT=setTimeout(tick,1000);return}
    pick(Math.floor(Math.random()*3))};
  autoT=setTimeout(tick,1000);
}
function pick(i){
  clearTimeout(autoT);if(HB[0].disabled)return;
  HB.forEach(x=>x.disabled=true);
  $('m').classList.remove('shake');$('c').classList.remove('shake');
  const c=Math.floor(Math.random()*3);
  $('m').textContent=H[i];$('c').textContent=H[c];
  const b=$('big');
  if(i===c){b.textContent='비겼다! 다시';b.style.color='#f1c40f';setTimeout(round,1200);return}
  const me=(i-c+3)%3===1;
  ws[me?'m':'o']++;showWins();
  if(ws.m===3||ws.o===3)return end(me);
  b.textContent=me?'아싸! 이겼다':'아유, 졌다';b.style.color=me?'#2ecc71':'#ff3b3b';
  snd(me?'assa':'ayu');
  setTimeout(()=>{if(on)round()},1500);   // 1.5초 뒤 저절로 다음 판
}
function end(me){
  const b=$('big');
  b.textContent=me?'🏆 최종 승리!':'최종 패배';b.style.color=me?'#ffd84a':'#ff3b3b';
  snd(me?'win3':'ayu');
  if(mode==='friend'){
    const p=$('pot');p.style.transition='';
    setTimeout(()=>{p.style.transform='translateY('+(me?'':'-')+'28vh) scale(1.6)';p.style.opacity=0},400);
    setTimeout(()=>{if(me){pt+=bet*2;addDelta(bet*2)}else op+=bet*2;save()},1200);
  }
  on=false;drawBets();$('go').textContent='다시 하기';$('go').disabled=false;
}
{const g=new URLSearchParams(location.search).get('g');if(g)$('back').href='index.html?room='+encodeURIComponent(g)}   // 그 대화방으로 돌아가기
save();drawBets();
</script>
</body></html>
