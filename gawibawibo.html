<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>가위바위보 게임</title>
<!-- 68번: 친구랑 하기 - 빨간 우체통 친구 목록(검색)이 먼저, 없으면 카톡·메신저 · 시작은 부른 사람(방장)만 · 맨 위 "승부" 네모에 걸린 점수 · 먼저 3번 이기면 승리 · 가입 500점이 안 들어와 있으면 여기서도 넣어요 · 카톡 갔다 와도 방이 안 없어져요(기다리는 중 멈춤 고침) -->
<!-- 66번: 점수 규칙 - 빨간 우체통 점수(가입 500점) 그대로 · 여러 명이 같이 · 모두 20점씩 걸고 3판 2선승(비긴 판은 안 셈) · 이긴 사람이 판돈을 다 가져가요 · 20점 안 되면 못 해요 · 맨 위 점수 1위 -->
<!-- 46번: '친구랑 하기'가 진짜로 친구와 같이 돼요 (각자 휴대폰 · 대화방에 초대 말풍선 · 둘이 다 고르면 결과 · 먼저 3승 · 나가면 상대 승리) -->
<!-- 41번: 화면 아래 시작 버튼·점수가 안 잘리게 (실제 보이는 높이에 맞춤, 손 그림 칸 줄임) · 게임에서 나가면 음악 꺼짐 · 점수는 계속 이어짐 -->
<!-- 40번: 한 판 승부가 나면 1.5초 뒤 저절로 다음 판 · 5초 안 누르면 3, 2, 1 세고 내 손이 저절로 나가요 -->
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}
.w{height:100vh;height:100dvh;height:var(--vh,100dvh);max-width:520px;margin:0 auto;padding:1.5vh 3vw calc(1.5vh + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:1.2vh}
h1{text-align:center;font-size:min(4vh,30px);font-weight:900;position:relative}
.back{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:min(2.6vh,18px);color:#ccc;text-decoration:none;font-weight:700}
.arena{flex:1;min-height:0;background:#111;border-radius:22px;display:flex;flex-direction:column;justify-content:center;gap:1.5vh;padding:1vh 3vw;overflow:hidden}
.row{display:flex;align-items:center}
.row>.side{flex:1;text-align:center;font-size:min(2.8vh,21px);font-weight:900}
.win{color:#ffd84a}
.side small{display:block;font-size:min(2.8vh,21px);color:#aaa;font-weight:900}
.hand{font-size:min(9vh,22vw);line-height:1}
.cpu{transform:rotate(180deg)}
.shake{animation:sh .25s infinite alternate}
.cpu.shake{animation:shc .25s infinite alternate}
@keyframes sh{to{transform:translateY(-12px)}}
@keyframes shc{from{transform:rotate(180deg)}to{transform:rotate(180deg) translateY(-12px)}}
.mid{display:flex;flex-direction:column;align-items:center;gap:.8vh}
.pot{font-size:min(2.2vh,17px);font-weight:800;color:#ffd84a;background:#2a2410;border:2px solid #ffd84a;border-radius:20px;padding:2px 12px;transition:transform .8s ease-in,opacity .8s}
.big{font-size:min(5vh,40px);font-weight:900;font-style:italic;min-height:1.2em;text-align:center}
.vs{font-size:min(3vh,24px);font-weight:900;color:#444;font-style:italic}
.btns{display:flex;gap:2vw;align-items:stretch;flex:none;min-height:min(13vh,110px);margin-bottom:14px}
.me,.st{flex:0 0 26%;border-radius:16px}
.me{background:linear-gradient(#ff3b3b,#a01818);display:flex;flex-direction:column;justify-content:center;text-align:center;font-weight:900}
.me span{font-size:min(1.9vh,14px);opacity:.9}
.me b{font-size:min(4vh,30px);line-height:1.1}
.hs{flex:1;display:flex;gap:3px}
.hs button{flex:1;background:#1c1c1c;border:2px solid #333;border-radius:14px;color:#fff;font-size:min(2.1vh,16px);font-weight:700;padding:.6vh 0}
.hs button i{font-style:normal;font-size:min(4.8vh,36px);display:block}
.hs button:disabled{opacity:.35}
.hs button:not(:disabled){border-color:#ff3b3b}
.st{display:flex;flex-direction:column;gap:4px}
.bets{display:flex;gap:3px}
.bets button{flex:1;background:#1c1c1c;border:2px solid #555;border-radius:20px;color:#ddd;font-size:min(1.9vh,14px);font-weight:800;padding:3px 0}
.bets button.on{background:#ffd84a;border-color:#ffd84a;color:#000}
.bets button:disabled{opacity:.4}
.bets .pr{flex:1;text-align:center;font-size:min(1.9vh,14px);color:#888;padding:3px 0}
.go{flex:1;background:#ff3b3b;border:0;border-radius:14px;color:#fff;font-size:min(2.8vh,21px);font-weight:900}
.go:disabled{opacity:.35}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh}
.ov h2{font-size:min(4.5vh,34px)}
.ov button{width:70%;max-width:320px;padding:2.2vh 0;border-radius:20px;border:0;font-size:min(3.4vh,26px);font-weight:900;color:#fff;background:#ff3b3b}
.ov button+button{background:#333}
.mk{position:fixed;right:6px;bottom:2px;font-size:10px;color:#555}
.rk1{position:fixed;top:0;left:0;right:0;z-index:40;text-align:center;font-size:12px;font-weight:800;color:#ffd84a;background:rgba(0,0,0,.55);padding:2px 6px;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body{padding-top:18px;box-sizing:border-box}
.pot2{display:none;flex-direction:column;align-items:center;flex:none}
.pot2 span{font-size:15px;color:#bbb;font-weight:700}
.pot2 b{font-size:52px;line-height:1.15;color:#ffd84a;border:2px solid #ffd84a;border-radius:12px;padding:0 22px;min-width:120px;text-align:center}
.fr{position:fixed;inset:0;background:#000;display:none;flex-direction:column;padding:22px 5vw calc(14px + env(safe-area-inset-bottom));gap:12px;z-index:50}
.fr h2{font-size:24px;text-align:center}
.fr input{font-size:20px;padding:12px;border-radius:12px;border:2px solid #444;background:#111;color:#fff}
.fr .ls{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.fr .ls button{text-align:left;font-size:22px;font-weight:800;padding:14px;border-radius:12px;border:2px solid #333;background:#1c1c1c;color:#fff}
.fr .ls p{color:#888;font-size:18px;text-align:center;padding:20px 0}
.fr .km{font-size:20px;font-weight:900;padding:16px;border-radius:14px;border:0;background:#fee500;color:#000}
.fr .cx{font-size:18px;padding:10px;border:0;background:none;color:#aaa}
#share{display:none;margin:0 auto;padding:1vh 4vw;border-radius:14px;border:0;background:#3a6fd8;color:#fff;font-size:min(2.4vh,18px);font-weight:900}
</style></head><body>
<div class="rk1" id="rk1"></div>
<div class="w">
 <h1><a class="back" id="back" href="index.html">‹ 돌아가기</a>가위바위보 게임</h1>
 <div class="pot2" id="pot2"><span>승부</span><b id="potN">0</b></div>
 <div class="arena">
  <div class="row"><div class="side win" id="ow">0승</div><div class="hand cpu" id="c">✊</div><div class="side" id="on">상대<small id="op"></small></div></div>
  <div class="mid"><div class="vs">VS</div><div class="big" id="big"></div><button id="share" onclick="shareLink()">📨 친구 부르기 (링크 보내기)</button></div>
  <div class="row"><div class="side win" id="mw">0승</div><div class="hand" id="m">✊</div><div class="side">나</div></div>
 </div>
 <div class="btns">
  <div class="me"><span>내 점수</span><b id="pt">500</b></div>
  <div class="hs">
   <button onclick="pick(0)" disabled><i>✌️</i>가위</button>
   <button onclick="pick(1)" disabled><i>✊</i>바위</button>
   <button onclick="pick(2)" disabled><i>🖐️</i>보</button>
  </div>
  <div class="st">
   <div class="bets" id="bets"></div>
   <button class="go" id="go" onclick="start()">시작</button>
  </div>
 </div>
</div>
<div class="ov" id="ov">
 <h2>누구랑 할까요?</h2>
 <button onclick="enter('friend')">친구랑 하기</button>
 <button onclick="enter('solo')">혼자 하기 (연습)</button>
</div>
<div class="fr" id="fr">
 <h2>📮 누구를 부를까요?</h2>
 <input id="frq" placeholder="🔍 친구 이름 찾기" oninput="frDraw()">
 <div class="ls" id="frl"></div>
 <button class="km" onclick="frMsg()">💬 카톡·메신저로 부르기</button>
 <button class="cx" onclick="frClose()">닫기</button>
</div>
<div class="mk">69KYM</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* 41번: 폰 아래 버튼줄에 안 가리게 - 실제로 보이는 높이로 맞춰요 */
function fitH(){const h=(window.visualViewport&&visualViewport.height)||innerHeight;document.documentElement.style.setProperty('--vh',h+'px')}
fitH();addEventListener('resize',fitH);if(window.visualViewport)visualViewport.addEventListener('resize',fitH);
const H=['✌️','✊','🖐️'],$=x=>document.getElementById(x),HB=[...document.querySelectorAll('.hs button')];
/* 소리: sound 폴더에 아래 이름으로 mp3를 올리면 나와요 */
const SND={bgm:'sound/bgm.mp3',hello:'sound/hello.mp3',gbb:'sound/gawibawibo.mp3',assa:'sound/assa.mp3',ayu:'sound/ayu.mp3',win3:'sound/win3.mp3'};
for(const k in SND){SND[k]=new Audio(SND[k])}
SND.bgm.loop=true;SND.bgm.volume=.35;
/* 41번: 게임에서 나가면 음악·소리 모두 끄기 */
function stopAll(){for(const k in SND){try{SND[k].pause();SND[k].currentTime=0}catch(e){}}}
addEventListener('pagehide',stopAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll();else if(mode&&$('ov').style.display==='none'){try{const p=SND.bgm.play();if(p)p.catch(()=>{})}catch(e){}}});
$('back').addEventListener('click',stopAll);
function snd(k){try{const a=SND[k];a.currentTime=0;const p=a.play();if(p)p.catch(()=>{})}catch(e){}}

let mode='solo',pt=0,bet=20,on=false,ws={m:0,o:0};
const BET=20,WIN_N=3;   // 68번: 한 게임 20점 · 먼저 3번 이기면 승리
function save(){$('pt').textContent=pt.toLocaleString()}
function showWins(){$('mw').textContent=ws.m+'승';$('ow').textContent=ws.o+'승'}
function drawBets(){
  $('bets').innerHTML=mode==='solo'?'<div class="pr">연습</div>':'<div class="pr">20점씩</div>';   // 66번
}
function setBet(n){bet=n;drawBets()}
function enter(md){
  mode=md;$('ov').style.display='none';
  $('on').firstChild.textContent=md==='solo'?'컴퓨터':'친구';
  snd('bgm');setTimeout(()=>snd('hello'),400);
  big('누가 이기나 해 보자!');
  drawBets();save();showWins();
  if(md==='friend'){$('go').disabled=true;if(RID)friendGo();else frOpen()}
}
/* 68번: 친구 부르기 - 빨간 우체통 친구 목록이 먼저 (검색), 없으면 카톡·메신저 */
const ROOMS=(()=>{try{return(JSON.parse(localStorage.getItem('rp_rooms'))||[]).filter(x=>x&&x.id&&x.title)}catch(e){return[]}})();
const escH=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function frOpen(){$('fr').style.display='flex';$('frq').value='';frDraw();big('부를 친구를 골라요')}
function frClose(){$('fr').style.display='none';if(!gid)big('친구랑 하려면 다시 들어와 주세요')}
function frDraw(){const q=$('frq').value.trim(),l=ROOMS.filter(x=>!q||x.title.includes(q));
  $('frl').innerHTML=l.length?l.map(x=>'<button data-id="'+escH(x.id)+'">💌 '+escH(x.title)+'</button>').join(''):'<p>'+(q?'찾는 친구가 없어요':'빨간 우체통 친구가 없어요')+'<br>아래 카톡·메신저로 불러요</p>';
  $('frl').querySelectorAll('button').forEach(b=>b.onclick=()=>{stopAll();location.href=location.pathname+'?g='+encodeURIComponent(b.dataset.id)+'&j=1'})}
function frMsg(){$('fr').style.display='none';gid='rps_'+Math.random().toString(36).slice(2,9);shareLink();friendGo()}
function big(t,c){const b=$('big');b.textContent=t;b.style.color=c||'#fff'}
function start(){
  if(mode==='friend')return fStart();
  if(!on){on=true;ws={m:0,o:0};showWins();drawBets()}
  round();
}
function round(){
  $('go').disabled=true;
  $('m').textContent=$('c').textContent='✊';
  $('m').classList.add('shake');$('c').classList.add('shake');
  const b=$('big');b.style.color='#fff';snd('gbb');
  const w=['가위','가위 바위','가위 바위 보!'];let i=0;
  const step=()=>{b.textContent=w[i];if(++i<3)setTimeout(step,500);else{HB.forEach(x=>x.disabled=false);waitPick()}};step();
}
let autoT=0;
function waitPick(){   // 5초 안 누르면 3, 2, 1 → 저절로
  clearTimeout(autoT);let n=8;
  const tick=()=>{if(HB[0].disabled)return;n--;
    if(n>3){autoT=setTimeout(tick,1000);return}
    if(n>0){const b=$('big');b.textContent=n+'';b.style.color='#ffd84a';autoT=setTimeout(tick,1000);return}
    pick(Math.floor(Math.random()*3))};
  autoT=setTimeout(tick,1000);
}
function pick(i){
  clearTimeout(autoT);if(HB[0].disabled)return;
  HB.forEach(x=>x.disabled=true);
  if(mode==='friend')return fPick(i);
  $('m').classList.remove('shake');$('c').classList.remove('shake');
  const c=Math.floor(Math.random()*3);
  $('m').textContent=H[i];$('c').textContent=H[c];
  const b=$('big');
  if(i===c){b.textContent='비겼다! 다시';b.style.color='#f1c40f';setTimeout(round,1200);return}
  const me=(i-c+3)%3===1;
  ws[me?'m':'o']++;showWins();
  if(ws.m===WIN_N||ws.o===WIN_N)return end(me);
  b.textContent=me?'아싸! 이겼다':'아유, 졌다';b.style.color=me?'#2ecc71':'#ff3b3b';
  snd(me?'assa':'ayu');
  setTimeout(()=>{if(on)round()},1500);   // 1.5초 뒤 저절로 다음 판
}
function end(me){
  const b=$('big');
  b.textContent=me?'🏆 최종 승리!':'최종 패배';b.style.color=me?'#ffd84a':'#ff3b3b';
  snd(me?'win3':'ayu');
  on=false;drawBets();$('go').textContent='다시 하기';$('go').disabled=false;
}
const RID=new URLSearchParams(location.search).get('g');   // 대화방 번호 (대화방에서 열었을 때)
if(RID&&!RID.startsWith('rps_'))$('back').href='index.html?room='+encodeURIComponent(RID);   // 그 대화방으로 돌아가기

/* ===== 46번: 친구랑 하기 (각자 휴대폰 · index.html과 같은 서버) ===== */
const CFG={apiKey:"AIzaSyDnsj9dxYrPow82Wd6kUnqVJvfACTqMWf4",authDomain:"giftwav-9ab6b.firebaseapp.com",databaseURL:"https://giftwav-9ab6b-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"giftwav-9ab6b",storageBucket:"giftwav-9ab6b.firebasestorage.app",messagingSenderId:"790729206880",appId:"1:790729206880:web:173a3a34e29e49a0b0a705"};
const ME=(()=>{try{return JSON.parse(localStorage.getItem('rp_me'))||{}}catch(e){return{}}})();
const myName=ME.name||'나';
let db=null,FU=null,authDone=false,waitAuth=false,gid=null,ref=null,R=null,oid=null,curRound=0,shown=0,paidKey=null,doneKey=null;
try{firebase.initializeApp(CFG);db=firebase.database();firebase.auth().onAuthStateChanged(u=>{FU=u;authDone=true;ptWatch();if(waitAuth){waitAuth=false;friendGo()}})}catch(e){}
/* ===== 66번: 게임 점수 (빨간 우체통과 같은 점수 · 서버 giftstory/points) ===== */
let ptRef=null;
function ptWatch(){if(ptRef){ptRef.off();ptRef=null}if(!db||!FU)return;ptRef=db.ref('giftstory/points/'+FU.uid+'/p');ptRef.on('value',s=>{if(s.val()==null)ptGift();pt=+(s.val()||0);save();ptMine()},()=>big('점수를 못 불러왔어요 (서버 규칙 확인)','#ff3b3b'))}
/* 68번: 구글·카카오로 로그인했는데 가입 500점이 없으면 여기서 넣어요 (한 번만) */
function ptGift(){if(!db||!FU||FU.isAnonymous||ptGift.d)return;ptGift.d=1;db.ref('giftstory/points/'+FU.uid).transaction(v=>{if(v&&v.p!=null)return;return Object.assign(v||{},{p:500,name:myName,at:Date.now()})}).catch(()=>{})}
function ptAdd(n){if(!db||!FU)return Promise.resolve(false);return db.ref('giftstory/points/'+FU.uid+'/p').transaction(v=>{v=+(v||0);if(v+n<0)return;return v+n}).then(r=>r.committed).catch(()=>false)}
function rankWatch(){if(!db)return;db.ref('giftstory/points').orderByChild('p').limitToLast(1).on('value',s=>{let t='';s.forEach(c=>{const x=c.val()||{};if(x.p>0)t='👑 점수 1위 '+(x.name||'?')+' · '+(+x.p).toLocaleString()+'점'});$('rk1').textContent=t||'👑 점수 1위 · 아직 없어요'},()=>{})}
function ptMine(){if(ref&&R&&FU&&R.players&&R.players[FU.uid]&&R.players[FU.uid].pts!==pt)ref.child('players/'+FU.uid+'/pts').set(pt).catch(()=>{})}
rankWatch();
async function friendGo(){
  if(!db){big('서버 연결이 안 돼요 · 혼자 하기로 해 보세요','#ff3b3b');return}
  if(!authDone){waitAuth=true;big('로그인 확인 중…');return}
  if(!FU){big('빨간 우체통에서 로그인한 다음 해 주세요','#ff3b3b');return}
  gid=gid||RID||('rps_'+Math.random().toString(36).slice(2,9));
  if(!RID)try{history.replaceState(null,'',location.pathname+'?g='+gid)}catch(e){}
  await db.ref('giftstory/rooms/'+gid+'/keys/'+FU.uid).set(true).catch(()=>{});
  ref=db.ref('giftstory/rooms/'+gid+'/rps');
  let made=false,why='';
  const r=await ref.transaction(v=>{
    const now=Date.now(),p={name:myName,pts:pt};
    if(!v||v.status==='end'&&!Object.keys(v.players||{}).length||now-(v.at||0)>15*60e3){made=true;return{host:FU.uid,status:'wait',players:{[FU.uid]:p},at:now}}
    made=false;v.players=v.players||{};
    if(v.players[FU.uid])return v;
    if(v.status==='play'){why='이미 시작했어요 · 끝나면 다시 들어와요';return}
    if(Object.keys(v.players).length>=10){why='이미 10명이 하고 있어요';return}   // 66번: 여러 명 (10명까지)
    v.players[FU.uid]=p;v.status='ready';v.at=now;return v;
  }).catch(()=>null);
  if(!r){big('서버에서 막혔어요 · 데이터베이스 규칙을 확인해 주세요','#ff3b3b');return}
  if(!r.committed){big(why||'들어갈 수 없어요','#ff3b3b');return}
  if(made&&RID&&!RID.startsWith('rps_'))   // 대화방에 초대 말풍선
    db.ref('giftstory/rooms/'+RID+'/msgs').push({from:ME.uid||FU.uid,name:myName,type:'gm',game:'gawibawibo.html',text:'✊ 가위바위보 같이 해요!',at:Date.now()}).catch(()=>{});
  ref.on('value',s=>onRps(s.val()));
}
function shareLink(){
  const url=location.origin+location.pathname+'?g='+gid,t='✊ 가위바위보 같이 해요! 눌러서 들어오세요';
  if(navigator.share)navigator.share({title:'가위바위보',text:t,url}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(t+' '+url).then(()=>big('링크를 복사했어요'));
}
function potShow(n){const b=$('pot2');if(n){$('potN').textContent=n;b.style.display='flex'}else b.style.display='none'}
function onRps(v){
  R=v;if(!v||!FU)return;const host=v.host===FU.uid;
  const ids=Object.keys(v.players||{}),others=ids.filter(u=>u!==FU.uid);oid=others[0]||null;
  $('on').firstChild.textContent=others.length>1?'친구 '+others.length+'명':oid?v.players[oid].name:'친구';
  const w=v.wins||{};$('mw').textContent=(w[FU.uid]||0)+'승';$('ow').textContent=(others.length?Math.max(...others.map(u=>w[u]||0)):0)+'승';
  $('share').style.display=(v.status==='wait'||v.status==='ready')&&!(RID&&!RID.startsWith('rps_'))?'block':'none';
  if(v.status==='wait'){on=false;potShow(0);big('친구를 기다리는 중…');$('go').textContent='시작';$('go').disabled=true;drawBets();return}
  if(v.status==='ready'){on=false;potShow(0);big(!host&&oid?'부른 사람이 시작을 누르면 해요':others.length>1?'모두 '+ids.length+'명! 시작을 눌러요':oid?v.players[oid].name+'님과 해요! 시작을 눌러요':'친구를 기다리는 중…');$('go').textContent='시작';$('go').disabled=!oid||!host;drawBets();return}   // 68번: 시작은 부른 사람만
  if(v.status==='play'){
    if(!v.players[FU.uid])return;
    const k=gid+v.start;
    if(paidKey!==k){paidKey=k;on=true;ptAdd(-(v.bet||BET));drawBets();$('op').textContent='';   // 66번: 내 점수에서 20점
}
    potShow(v.pot||BET*ids.length);   // 68번: 맨 위 "승부" 네모
    if(v.round!==curRound){curRound=v.round;round()}
    const pk=v.picks||{};
    if(ids.length>1&&ids.every(u=>pk[u]!=null)&&shown!==v.round){shown=v.round;fShow(pk,v.round)}
    return;
  }
  if(v.status==='end'){
    if(doneKey!==gid+v.start&&paidKey===gid+v.start){doneKey=gid+v.start;fEnd(v)}
    else if(doneKey!==gid+v.start){on=false;big(oid?(host?'다시 하기를 누르면 또 해요':'부른 사람이 다시 하기를 누르면 해요'):'친구를 기다리는 중…');$('go').textContent='다시 하기';$('go').disabled=!oid||!host;drawBets()}
  }
}
function fStart(){
  if(!R||!oid||R.host!==FU.uid)return;
  if(R.status==='end'){ref.transaction(v=>{if(!v||v.status!=='end')return;v.status=Object.keys(v.players||{}).length>1?'ready':'wait';v.at=Date.now();return v});return}
  if(pt<BET){big('점수가 부족해요 (20점 필요)','#ff3b3b');return}   // 66번
  const ps=R.players||{},poor=Object.keys(ps).filter(u=>u!==FU.uid&&(+ps[u].pts||0)<BET);
  if(poor.length){big(poor.map(u=>ps[u].name).join(', ')+'님 점수가 부족해요','#ff3b3b');return}
  $('go').disabled=true;
  ref.transaction(v=>{if(!v||v.status!=='ready')return;const n=Object.keys(v.players||{}).length;if(n<2)return;v.status='play';v.round=1;v.picks={};v.wins={};v.bet=BET;v.pot=BET*n;v.start=Date.now();v.at=Date.now();delete v.winner;delete v.quit;return v});
}
function fPick(i){
  $('m').classList.remove('shake');$('m').textContent=H[i];
  big('친구가 고르는 중…','#ffd84a');
  ref.child('picks/'+FU.uid).set(i).catch(()=>big('보내지 못했어요 · 인터넷을 확인해 주세요','#ff3b3b'));
}
const winShape=sh=>sh.length===2?((sh[0]-sh[1]+3)%3===1?sh[0]:sh[1]):null;   // 두 가지 손만 나오면 승부 · 한 가지거나 세 가지 다 나오면 비김
function fShow(pk,r){
  clearTimeout(autoT);HB.forEach(x=>x.disabled=true);
  $('m').classList.remove('shake');$('c').classList.remove('shake');
  const ids=Object.keys(R.players||{}),others=ids.filter(u=>u!==FU.uid),my=pk[FU.uid];
  $('m').textContent=H[my];$('c').textContent=oid&&pk[oid]!=null?H[pk[oid]]:'✊';
  $('op').textContent=others.length>1?' '+others.map(u=>R.players[u].name+H[pk[u]]).join(' '):'';
  const wn=winShape([...new Set(ids.map(u=>pk[u]))]),me=wn!==null&&my===wn;
  if(wn===null)big('비겼다! 다시','#f1c40f');
  else{big(me?'아싸! 이겼다':'아유, 졌다',me?'#2ecc71':'#ff3b3b');snd(me?'assa':'ayu')}
  if(R.host!==FU.uid)return;   // 다음 판은 방장 폰이 넘겨요
  setTimeout(()=>ref.transaction(v=>{
    if(!v||v.status!=='play'||v.round!==r)return;
    const p=v.picks||{},ids=Object.keys(v.players||{});if(ids.length<2||ids.some(u=>p[u]==null))return;
    const w=winShape([...new Set(ids.map(u=>p[u]))]);v.wins=v.wins||{};v.at=Date.now();
    if(w!==null){ids.forEach(u=>{if(p[u]===w)v.wins[u]=(v.wins[u]||0)+1});
      const top=Math.max(...ids.map(u=>v.wins[u]||0)),lead=ids.filter(u=>(v.wins[u]||0)===top);
      if(top>=WIN_N&&lead.length===1){v.status='end';v.winner=lead[0];return v}}   // 2승 먼저 (같이 2승이면 한 판 더)
    v.round=r+1;v.picks={};return v;
  }),wn===null?1200:1500);
}
function fEnd(v){
  on=false;clearTimeout(autoT);HB.forEach(x=>x.disabled=true);
  $('m').classList.remove('shake');$('c').classList.remove('shake');
  const me=v.winner===FU.uid,wn=v.winner&&v.players&&v.players[v.winner]?v.players[v.winner].name:'친구';
  if(v.quit&&me)big('친구가 나갔어요 · 내가 이겼어요','#ffd84a');
  else big(me?'🏆 최종 승리!':'최종 패배 · '+wn+' 승리',me?'#ffd84a':'#ff3b3b');
  snd(me?'win3':'ayu');
  if(me)ptAdd(v.pot||v.bet*2);   // 66번: 이긴 사람이 판돈을 다 가져가요
  drawBets();$('go').textContent='다시 하기';$('go').disabled=v.host!==FU.uid;
}
/* 나가면: 기다리는 중이면 방 지우기 · 하는 중이면 나는 빠지고 (한 명 남으면 그 사람이 이겨요) */
function fLeave(){
  if(!ref||!FU||!R)return;
  try{ref.off()}catch(e){}
  if(R.status==='wait'&&Object.keys(R.players||{}).length<=1){ref.remove().catch(()=>{});return}
  ref.transaction(v=>{
    if(!v||!v.players||!v.players[FU.uid])return;
    delete v.players[FU.uid];if(v.picks)delete v.picks[FU.uid];
    const rest=Object.keys(v.players);if(!rest.length)return null;
    if(v.host===FU.uid)v.host=rest[0];
    if(v.status==='play'){if(rest.length===1){v.status='end';v.winner=rest[0];v.quit=FU.uid}}
    else if(rest.length<2)v.status='wait';
    v.at=Date.now();return v;
  }).catch(()=>{});
}
$('back').addEventListener('click',fLeave);   // 68번: 카톡으로 친구 부르러 갔다 오면 방이 지워지던 것 고침 (돌아가기를 눌러야만 나가요)
save();drawBets();
if(RID&&(RID.startsWith('rps_')||new URLSearchParams(location.search).get('j')))enter('friend');   // 친구가 보낸 링크로 들어오면 바로 같이 하기
</script>
</body></html>
