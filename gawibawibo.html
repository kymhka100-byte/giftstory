<!-- 77번: 같이 하기 고침 - 부를 때 내 ⭐20 자동으로 걸림 · 친구가 들어오면 친구 ⭐20도 자동으로 걸림(맨 위 승부 20→40) · 둘 다 걸려야 '들어왔어요' 확인 창 → 확인 누르면 바로 시작(창이 다시 안 떠요) · 한 판 끝나면 저절로 ⭐20씩 다시 걸리고 시작만 누르면 돼요 · 시작 전에 나가면 건 ⭐ 돌려받아요 -->
<!-- 75번: 같이 하기 멈춤 고침 - 친구가 들어오면 부른 사람에게 '들어왔어요' 확인 창 → 확인 누르면 바로 시작 · 부른 사람이 없거나 15초 넘게 안 누르면 누구나 시작 -->
<!-- 68번: 친구랑 하기 - 빨간 우체통 친구 목록(검색)이 먼저, 없으면 카톡·메신저 · 시작은 부른 사람(방장)만 · 맨 위 "승부" 네모에 걸린 점수 · 먼저 3번 이기면 승리 · 가입 500점이 안 들어와 있으면 여기서도 넣어요 · 카톡 갔다 와도 방이 안 없어져요(기다리는 중 멈춤 고침) -->
<!-- 66번: 점수 규칙 - 빨간 우체통 점수(가입 500점) 그대로 · 여러 명이 같이 · 모두 20점씩 걸고 3판 2선승(비긴 판은 안 셈) · 이긴 사람이 판돈을 다 가져가요 · 20점 안 되면 못 해요 · 맨 위 점수 1위 -->
<!-- 46번: '친구랑 하기'가 진짜로 친구와 같이 돼요 (각자 휴대폰 · 대화방에 초대 말풍선 · 둘이 다 고르면 결과 · 먼저 3승 · 나가면 상대 승리) -->
<!-- 41번: 화면 아래 시작 버튼·점수가 안 잘리게 (실제 보이는 높이에 맞춤, 손 그림 칸 줄임) · 게임에서 나가면 음악 꺼짐 · 점수는 계속 이어짐 -->

<script>
/* 41번: 폰 아래 버튼줄에 안 가리게 - 실제로 보이는 높이로 맞춰요 */
function fitH(){const h=(window.visualViewport&&visualViewport.height)||innerHeight;document.documentElement.style.setProperty('--vh',h+'px')}
fitH();addEventListener('resize',fitH);if(window.visualViewport)visualViewport.addEventListener('resize',fitH);
const H=['✌️','✊','🖐️'],$=x=>document.getElementById(x),HB=[...document.querySelectorAll('.hs button')];
/* 소리: sound 폴더에 아래 이름으로 mp3를 올리면 나와요 */
const SND={bgm:'sound/bgm.mp3',hello:'sound/hello.mp3',gbb:'sound/gawibawibo.mp3',assa:'sound/assa.mp3',ayu:'sound/ayu.mp3',win3:'sound/win3.mp3'};
for(const k in SND){SND[k]=new Audio(SND[k])}
SND.bgm.loop=true;SND.bgm.volume=.35;
/* 41번: 게임에서 나가면 음악·소리 모두 끄기 */
function stopAll(){for(const k in SND){try{SND[k].pause();SND[k].currentTime=0}catch(e){}}}
addEventListener('pagehide',stopAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll();else if(mode&&$('ov').style.display==='none'){try{const p=SND.bgm.play();if(p)p.catch(()=>{})}catch(e){}}});
$('back').addEventListener('click',stopAll);
function snd(k){try{const a=SND[k];a.currentTime=0;const p=a.play();if(p)p.catch(()=>{})}catch(e){}}

let mode='solo',pt=0,bet=20,on=false,ws={m:0,o:0};
const BET=20,WIN_N=3;   // 68번: 한 게임 20점 · 먼저 3번 이기면 승리
function save(){$('pt').textContent=pt.toLocaleString()}
function showWins(){$('mw').textContent=ws.m+'승';$('ow').textContent=ws.o+'승'}
function drawBets(){
  $('bets').innerHTML=mode==='solo'?'<div class="pr">연습</div>':'<div class="pr">⭐ 20씩</div>';   // 66번
}
function setBet(n){bet=n;drawBets()}
function enter(md){
  mode=md;$('ov').style.display='none';
  $('on').firstChild.textContent=md==='solo'?'컴퓨터':'친구';
  snd('bgm');setTimeout(()=>snd('hello'),400);
  big('누가 이기나 해 보자!');
  drawBets();save();showWins();
  if(md==='friend'){$('go').disabled=true;if(RID)friendGo();else frOpen()}
}
/* 68번: 친구 부르기 - 빨간 우체통 친구 목록이 먼저 (검색), 없으면 카톡·메신저 */
const ROOMS=(()=>{try{return(JSON.parse(localStorage.getItem('rp_rooms'))||[]).filter(x=>x&&x.id&&x.title)}catch(e){return[]}})();
const escH=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function frOpen(){$('fr').style.display='flex';$('frq').value='';frDraw();big('부를 친구를 골라요')}
function frClose(){$('fr').style.display='none';if(!gid)big('친구랑 하려면 다시 들어와 주세요')}
function frDraw(){const q=$('frq').value.trim(),l=ROOMS.filter(x=>!q||x.title.includes(q));
  $('frl').innerHTML=l.length?l.map(x=>'<button data-id="'+escH(x.id)+'">💌 '+escH(x.title)+'</button>').join(''):'<p>'+(q?'찾는 친구가 없어요':'빨간 우체통 친구가 없어요')+'<br>아래 카톡·메신저로 불러요</p>';
  $('frl').querySelectorAll('button').forEach(b=>b.onclick=()=>{stopAll();location.href=location.pathname+'?g='+encodeURIComponent(b.dataset.id)+'&j=1'})}
function frMsg(){$('fr').style.display='none';gid='rps_'+Math.random().toString(36).slice(2,9);shareLink();friendGo()}
function big(t,c){const b=$('big');b.textContent=t;b.style.color=c||'#fff'}
function start(){
  if(mode==='friend')return fStart();
  if(!on){on=true;ws={m:0,o:0};showWins();drawBets()}
  round();
}
function round(){
  $('go').disabled=true;
  $('m').textContent=$('c').textContent='✊';
  $('m').classList.add('shake');$('c').classList.add('shake');
  const b=$('big');b.style.color='#fff';snd('gbb');
  const w=['가위','가위 바위','가위 바위 보!'];let i=0;
  const step=()=>{b.textContent=w[i];if(++i<3)setTimeout(step,500);else{HB.forEach(x=>x.disabled=false);waitPick()}};step();
}
let autoT=0;
function waitPick(){   // 5초 안 누르면 3, 2, 1 → 저절로
  clearTimeout(autoT);let n=8;
  const tick=()=>{if(HB[0].disabled)return;n--;
    if(n>3){autoT=setTimeout(tick,1000);return}
    if(n>0){const b=$('big');b.textContent=n+'';b.style.color='#ffd84a';autoT=setTimeout(tick,1000);return}
    pick(Math.floor(Math.random()*3))};
  autoT=setTimeout(tick,1000);
}
function pick(i){
  clearTimeout(autoT);if(HB[0].disabled)return;
  HB.forEach(x=>x.disabled=true);
  if(mode==='friend')return fPick(i);
  $('m').classList.remove('shake');$('c').classList.remove('shake');
  const c=Math.floor(Math.random()*3);
  $('m').textContent=H[i];$('c').textContent=H[c];
  const b=$('big');
  if(i===c){b.textContent='비겼다! 다시';b.style.color='#f1c40f';setTimeout(round,1200);return}
  const me=(i-c+3)%3===1;
  ws[me?'m':'o']++;showWins();
  if(ws.m===WIN_N||ws.o===WIN_N)return end(me);
  b.textContent=me?'아싸! 이겼다':'아유, 졌다';b.style.color=me?'#2ecc71':'#ff3b3b';
  snd(me?'assa':'ayu');
  setTimeout(()=>{if(on)round()},1500);   // 1.5초 뒤 저절로 다음 판
}
function end(me){
  const b=$('big');
  b.textContent=me?'🏆 최종 승리!':'최종 패배';b.style.color=me?'#ffd84a':'#ff3b3b';
  snd(me?'win3':'ayu');
  on=false;drawBets();$('go').textContent='다시 하기';$('go').disabled=false;
}
const RID=new URLSearchParams(location.search).get('g');   // 대화방 번호 (대화방에서 열었을 때)
if(RID&&!RID.startsWith('rps_'))$('back').href='index.html?room='+encodeURIComponent(RID);   // 그 대화방으로 돌아가기

/* ===== 46번: 친구랑 하기 (각자 휴대폰 · index.html과 같은 서버) ===== */
const CFG={apiKey:"AIzaSyDnsj9dxYrPow82Wd6kUnqVJvfACTqMWf4",authDomain:"giftwav-9ab6b.firebaseapp.com",databaseURL:"https://giftwav-9ab6b-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"giftwav-9ab6b",storageBucket:"giftwav-9ab6b.firebasestorage.app",messagingSenderId:"790729206880",appId:"1:790729206880:web:173a3a34e29e49a0b0a705"};
const ME=(()=>{try{return JSON.parse(localStorage.getItem('rp_me'))||{}}catch(e){return{}}})();
const myName=ME.name||'나';
let db=null,FU=null,authDone=false,waitAuth=false,gid=null,ref=null,R=null,oid=null,curRound=0,shown=0,paidKey=null,doneKey=null,ptLoaded=false,payKey='',paying=false,jpDone='';
try{firebase.initializeApp(CFG);db=firebase.database();firebase.auth().onAuthStateChanged(u=>{FU=u;authDone=true;ptWatch();if(waitAuth){waitAuth=false;friendGo()}})}catch(e){}
/* ===== 66번: 게임 점수 (빨간 우체통과 같은 점수 · 서버 giftstory/points) ===== */
let ptRef=null;
function ptWhy(t){const e=document.querySelector('.me span');if(e)e.textContent=t||'내 ⭐'}
function ptWatch(){if(ptRef){ptRef.off();ptRef=null}if(!db)return ptWhy('서버 연결 안 됨');if(!FU)return ptWhy('로그인 필요');if(FU.isAnonymous)ptWhy('구글·카톡 로그인 필요');else ptWhy('');ptRef=db.ref('giftstory/points/'+FU.uid+'/p');ptRef.on('value',s=>{if(s.val()==null)ptGift();pt=+(s.val()||0);save();const f=!ptLoaded;ptLoaded=true;if(f&&R)onRps(R)},()=>{ptWhy('⭐ 서버 막힘');big('⭐을 못 불러왔어요 (서버 규칙 확인)','#ff3b3b')})}
/* 68번: 구글·카카오로 로그인했는데 가입 500점이 없으면 여기서 넣어요 (한 번만) */
function ptGift(){if(!db||!FU||FU.isAnonymous||ptGift.d)return;ptGift.d=1;db.ref('giftstory/points/'+FU.uid).transaction(v=>{if(v&&v.p!=null)return;return Object.assign(v||{},{p:500,name:myName,at:Date.now()})}).catch(()=>{})}
function ptAdd(n){if(!db||!FU)return Promise.resolve(false);return db.ref('giftstory/points/'+FU.uid+'/p').transaction(v=>{v=+(v||0);if(v+n<0)return;return v+n}).then(r=>r.committed).catch(()=>false)}
function rankWatch(){if(!db)return;db.ref('giftstory/points').orderByChild('p').limitToLast(1).on('value',s=>{let t='';s.forEach(c=>{const x=c.val()||{};if(x.p>0)t='👑 ⭐ 1위 '+(x.name||'?')+' · ⭐ '+(+x.p).toLocaleString()});$('rk1').textContent=t||'👑 ⭐ 1위 · 아직 없어요'},()=>{})}
/* 77번: 판돈 자동으로 걸기 - 방에 들어오면(부른 사람·들어온 친구 모두) 내 ⭐에서 20을 빼고 방에 '걸었어요(paid)' 표시 */
const gN=v=>v.gno||1,isPaid=(v,u)=>!!(v.players&&v.players[u]&&v.players[u].paid===gN(v));

    if(!v||!v.players||!v.players[FU.uid])return;
    delete v.players[FU.uid];if(v.picks)delete v.picks[FU.uid];
