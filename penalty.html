<!-- 5번(69번): 친구랑 하기 들어가면 맨 위 "승부" 점수가 바로 보여요 · 점수가 0이면 내 점수 칸에 이유(로그인 필요·서버 막힘)를 보여 줘요 -->
<!-- 4번(68번): 친구랑 하기 - 빨간 우체통 친구 목록(검색)이 먼저, 없으면 카톡·메신저 · 시작은 부른 사람(방장)만 · 맨 위 "승부" 네모에 걸린 점수(비기면 계속 쌓여요) · 가입 500점이 안 들어와 있으면 여기서도 넣어요 · 카톡 갔다 와도 방이 안 없어져요(기다리는 중 멈춤 고침) -->
<!-- 3번(66번): 점수 규칙 - 빨간 우체통 점수(가입 500점) 그대로 · 한 사람 50점씩 걸고 5번씩 차서 골 많은 사람이 판돈을 다 가져가요 · 골 수가 같으면 판돈은 쌓아 두고 50점씩 또 걸고 다시 · 다음 판 이긴 사람이 쌓인 것까지 다 · 50점 안 되면 못 해요 · 맨 위 점수 1위 -->
<!-- 2번: 소리 순서 시작안내→레디→3,2,1→휘슬 (소리가 다 끝나야 다음으로) · 차기 전 배경음악 작게, 골/노골 소리 끝나면 원래대로 · 승부 끝나면 배경음악 꺼짐 · 골/노골 판정을 화면 속 골대·골키퍼 모양에 맞춤 -->
<!-- 1번: 승부차기 첫 버전 · 공을 손가락으로 밀어서 슛(세기=속도, 방향=방향, 길게=뜬 공, 짧게=땅볼) · 3,2,1 삑 후 3초 안에 슛(못 차면 실축) · 골키퍼는 손가락으로 왼쪽/오른쪽 밀기, 가만히 있으면 가운데, 미리 날면 쓰러짐 · 3,2,1 동안 골키퍼 옆으로 살짝 움직이기 · 공 만지면 빙그르르 · 처음 3번 화살표 안내 · 친구랑 하기(대화방 초대) / 혼자 하기(연습, 컴퓨터) · 한 번 찰 때마다 20점, 3번 연속 골이면 다음 한 번 40점 · 5번씩 차고 같으면 한 번씩 더 -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script>
function fitH(){const h=(window.visualViewport&&visualViewport.height)||innerHeight;document.documentElement.style.setProperty('--vh',h+'px');setTimeout(sizeCv,50)}
addEventListener('resize',fitH);if(window.visualViewport)visualViewport.addEventListener('resize',fitH);
const $=x=>document.getElementById(x);
/* 소리: sound 폴더에 아래 이름으로 mp3를 올리면 나와요 (없으면 조용히 진행) */
const SND={bgm:'penalty_bgm',start:'penalty_start',ready:'penalty_ready',whistle:'penalty_whistle',shoot:'penalty_shoot',goal:'penalty_goal',nogoal:'penalty_nogoal',win:'penalty_win'};
for(const k in SND){SND[k]=new Audio('sound/'+SND[k]+'.mp3')}
SND.bgm.loop=true;
function snd(k){try{const a=SND[k];a.currentTime=0;const p=a.play();if(p)p.catch(()=>{})}catch(e){}}
/* 소리가 다 끝나야 다음으로 (파일이 없으면 바로 넘어가요) */
function sndThen(k,cb){let done=false;const a=SND[k];const go=()=>{if(done)return;done=true;a.removeEventListener('ended',go);a.removeEventListener('error',go);clearTimeout(t);cb()};
  const t=setTimeout(go,12000);
  try{if(a.error)return go();a.addEventListener('ended',go);a.addEventListener('error',go);a.currentTime=0;const p=a.play();if(p)p.catch(go)}catch(e){go()}}
let bgmOn=false;
function bgmPlay(){bgmOn=true;SND.bgm.volume=.3;snd('bgm')}
function bgmStop(){bgmOn=false;try{SND.bgm.pause();SND.bgm.currentTime=0}catch(e){}}
function bgmVol(v){try{SND.bgm.volume=v}catch(e){}}
function stopAll(){for(const k in SND){try{SND[k].pause();SND[k].currentTime=0}catch(e){}}}
addEventListener('pagehide',stopAll);$('back').addEventListener('click',stopAll);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAll();else if(bgmOn){try{SND.bgm.play().catch(()=>{})}catch(e){}}});

/* ===== 점수 (가위바위보·뽑기와 같은 점수) ===== */
let mode=null,pt=0,on=false;
const BET=50;   // 66번: 한 사람 50점씩
function save(){$('pt').textContent=pt.toLocaleString()}
let tut=0;try{tut=+(localStorage.getItem('pk-tut')||0)}catch(e){}

/* ===== 화면 (360 x 600 기준으로 그려요) ===== */
const W=360,H=600,cv=$('cv'),cx=cv.getContext('2d');let K=1,OX=0,OY=0;
function sizeCv(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;K=Math.min(cv.width/W,cv.height/H);OX=(cv.width-W*K)/2;OY=(cv.height-H*K)/2}
fitH();sizeCv();
const GL=62,GR=298,GT=170,GB=280,BX=180,BY=530;   // 골대(찰 때 화면)
const CROWD=[...Array(40)].map((_,i)=>({x:12+(i%13)*28+(Math.floor(i/13)%2)*14,y:30+Math.floor(i/13)*30,c:['#3a4560','#55607d','#6b4a4a','#4a6b55','#6b6340'][i%5],p:Math.random()*6}));
const SIGNS=[{x:14,t:'골!',c:'#e63946',f:'#fff'},{x:142,t:'화이팅',c:'#f4c430',f:'#111'},{x:270,t:'이겨라',c:'#2a9df4',f:'#fff'}];

/* 한 번 차기(슛)의 상태 */
let S=null,msg='',msgC='#fff',msgAt=0,sub='',spin=0,spinV=0,touch=null;
function newShot(n,role,bet,intro){
  bgmVol(.08);
  S={n,role,bet,t0:performance.now(),ph:intro?'intro':'count',kx:0,kick:null,strike:0,dive:null,res:null,resAt:0,back:0};
  sub=(role==='kick'?'⚽ 내가 찰 차례':'🧤 내가 막을 차례')+(mode==='friend'?' · 판돈 ⭐ '+bet:'');
  if(!intro)return setMsg('3');
  setMsg('준비','#ffd84a');const me=S;
  sndThen('start',()=>sndThen('ready',()=>{if(S===me&&S.ph==='intro'){S.ph='count';S.t0=performance.now();setMsg('3')}}));
}
function setMsg(t,c){msg=t;msgC=c||'#fff';msgAt=performance.now()}

/* ===== 결과 정하기 (찰 때 화면 기준 좌표) ===== */
function judge(k,dv,kx){
  if(k.miss)return{goal:false,why:'실축!',d:0};
  const bx=k.gx,by=GB-6-k.gh,r=8;   // 공이 골대에 닿는 자리 (화면 그대로)
  if(bx<GL-3||bx>GR+3||by<GT-3)return{goal:false,why:'빗나갔어요',d:dv?dv.d:0};
  let f=0,d=0,why='';
  if(dv){d=dv.d;if(dv.t<-.3)return{goal:true,why:'미리 날아서 쓰러졌어요',d};f=Math.max(0,Math.min(1,(k.T-dv.t)/.28))}
  // 공이 도착할 때 골키퍼 모양(그림과 똑같이)에 닿으면 선방
  const ang=d*f*1.3,px=BX+kx+d*f*88,py=GB-4-f*18,dx=bx-px,dy=by-py,c=Math.cos(ang),sn=Math.sin(ang);
  const lx=dx*c+dy*sn,ly=-dx*sn+dy*c,ax=Math.abs(lx);
  const saved=(ax<=14+r&&ly>=-60-r&&ly<=18+r)||(ax<=39+r&&ly>=-42-r&&ly<=-30+r);
  if(!saved&&dv&&f<1)why='늦었어요';
  return{goal:!saved,why:saved?'선방!':why,d};
}
/* ===== 3, 2, 1 → 삑 ===== */
function tick(now){
  if(!S)return;const e=now-S.t0;
  if(S.ph==='count'){
    const c=3-Math.floor(e/1000);
    if(c>0){if(msg!==c+'')setMsg(c+'','#ffd84a')}
    else{S.ph='go';S.go=now;setMsg('삑! 슛!','#7CFC00');snd('whistle');
      if(S.role==='keep'&&mode==='solo')setTimeout(cpuKick,500+Math.random()*1800)}
  }
  if(S.ph==='go'&&S.role==='kick'&&now-S.go>3000)doKick({miss:true});
  if(S.ph==='fly'&&now>S.strike+S.kick.T*1000+80&&!S.res){
    if(mode==='solo'||S.role==='keep'){
      const dv=S.dive?{d:S.role==='keep'?-S.dive.d:S.dive.d,t:(S.dive.at-S.strike)/1000}:null;
      const r=judge(S.kick,dv,S.role==='keep'?-S.kx/1.333:S.kx);r.n=S.n;
      if(mode==='friend')ref.child('res').set(r).catch(()=>{});
      showRes(r);
    }else if(!S.wait){S.wait=1;setMsg('…','#aaa')}
  }
}
/* 찰 때: 공을 손가락으로 밀기 */
function swipeKick(dx,dy,dt){
  const len=Math.hypot(dx,dy),sp=len/Math.max(dt,30);
  doKick({gx:BX+dx/(-dy)*240,gh:Math.max(0,len-70)*.5,T:Math.min(1,Math.max(.38,1-sp*.35))});
}
function doKick(k){
  if(!S||S.ph!=='go'||S.role!=='kick')return;
  k.n=S.n;S.kick=k;S.ph='fly';S.strike=performance.now();
  if(k.miss){S.kick.T=0;setMsg('시간 초과','#ff3b3b')}else{snd('shoot');setMsg('');spinV=.5}
  if(mode==='friend')ref.child('kick').set(k).catch(()=>{});
  else if(!k.miss)cpuKeep(k);
  if(tut<3){tut++;try{localStorage.setItem('pk-tut',tut)}catch(e){}}
}
/* 막을 때: 상대가 찬 공이 옴 (뒤로 물러났다 달려와서 차요) */
function recvKick(k){
  if(!S||S.kick)return;S.kick=k;
  if(k.miss){S.ph='fly';S.strike=performance.now();S.kick.T=0;setMsg('상대 실축!','#7CFC00');return}
  S.ph='run';S.runAt=performance.now();S.strike=S.runAt+650;
  setTimeout(()=>{if(S&&S.kick===k){S.ph='fly';snd('shoot');setMsg('')}},650);
  if(tut<3){tut++;try{localStorage.setItem('pk-tut',tut)}catch(e){}}
}
/* 컴퓨터 (연습) */
function cpuKick(){if(!S||S.role!=='keep'||S.kick)return;recvKick({n:S.n,gx:75+Math.random()*210,gh:Math.random()<.5?Math.random()*20:20+Math.random()*80,T:.45+Math.random()*.4})}
function cpuKeep(k){
  const rel=k.gx-BX,side=Math.abs(rel)<30?0:Math.sign(rel);
  const d=Math.random()<.4?side:[-1,0,1][Math.floor(Math.random()*3)];
  S.dive=d?{d,at:S.strike+(k.T<.5&&Math.random()<.5?k.T*1000:(Math.random()*.25-.08)*1000)}:null;
}
function showRes(r){
  if(!S||S.res)return;S.res=r;S.resAt=performance.now();
  if(r.d&&!S.dive)S.dive={d:S.role==='keep'?-r.d:r.d,at:S.strike+60};
  const meKick=S.role==='kick',good=meKick?r.goal:!r.goal;
  if(r.goal)setMsg('골!!!','#ffd84a');else setMsg(r.why==='미리 날아서 쓰러졌어요'?'노골':r.why||'노골','#ff6b6b');
  sndThen(r.goal?'goal':'nogoal',()=>{if(bgmOn)bgmVol(.3)});
  if(mode==='solo')soloNext(r.goal);
  else if(R&&R.host===FU.uid)setTimeout(()=>hostNext(S.n),2300);
}

/* ===== 손가락 ===== */
function lp(t){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;return{x:((t.clientX-r.left)*d-OX)/K,y:((t.clientY-r.top)*d-OY)/K}}
cv.addEventListener('pointerdown',e=>{
  if(!S)return;const p=lp(e);
  if(S.role==='kick'&&Math.hypot(p.x-BX,p.y-BY)<55){touch={x:p.x,y:p.y,t:performance.now()};spinV=.25}
  else if(S.role==='keep'&&Math.abs(p.x-(BX+S.kx))<75&&p.y>380){touch={x:p.x,y:p.y,t:performance.now(),kx:S.kx}}
});
cv.addEventListener('pointermove',e=>{
  if(!touch||!S)return;const p=lp(e),dx=p.x-touch.x;
  if(S.role==='kick'){spinV=Math.min(.6,spinV+.02);return}
  if(S.dive||S.ph==='intro')return;
  if(S.ph==='count')S.kx=Math.max(-18,Math.min(18,touch.kx+dx));   // 3,2,1 동안은 살짝만
  else if(Math.abs(dx)>35){S.dive={d:Math.sign(dx),at:performance.now()};touch=null}
});
function up(e){
  if(!touch||!S){touch=null;return}const p=lp(e),dx=p.x-touch.x,dy=p.y-touch.y,dt=performance.now()-touch.t;
  if(S.role==='kick'&&dy<-25&&S.ph==='go')swipeKick(dx,dy,dt);
  touch=null;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',()=>touch=null);

/* ===== 그리기 ===== */
function rr(x,y,w,h,r,c){cx.fillStyle=c;cx.beginPath();cx.roundRect?cx.roundRect(x,y,w,h,r):cx.rect(x,y,w,h);cx.fill()}
function ball(x,y,r){
  cx.save();cx.translate(x,y);cx.rotate(spin);cx.fillStyle='#fff';cx.beginPath();cx.arc(0,0,r,0,7);cx.fill();
  cx.fillStyle='#222';cx.beginPath();for(let i=0;i<5;i++){const a=i*1.2566-1.57;cx.lineTo(Math.cos(a)*r*.42,Math.sin(a)*r*.42)}cx.fill();
  for(let i=0;i<5;i++){const a=i*1.2566+.63;cx.beginPath();cx.arc(Math.cos(a)*r*.85,Math.sin(a)*r*.85,r*.2,0,7);cx.fill()}
  cx.restore();
}
function crowd(now){
  rr(0,0,W,150,0,'#1b2233');
  for(const c of CROWD){const b=Math.sin(now/300+c.p)*2;cx.fillStyle=c.c;cx.beginPath();cx.arc(c.x,c.y+b,9,0,7);cx.fill();rr(c.x-9,c.y+8+b,18,12,4,c.c)}
  cx.font='900 13px system-ui';cx.textAlign='center';

    if(!v||v.status!=='play'||v.n!==n||!v.res||v.res.n!==n)return;
    const o=v.order,k=o[n%2];v.goals=v.goals||{};
    if(v.res.goal)v.goals[k]=(v.goals[k]||0)+1;
    const g=[v.goals[o[0]]||0,v.goals[o[1]]||0];v.at=Date.now();
    if(over5(n,g)){if(g[0]===g[1]){v.status='tie';v.carry=v.pot||0;return v}v.status='end';v.winner=g[0]>g[1]?o[0]:o[1];return v}   // 66번
    v.n=n+1;delete v.kick;delete v.res;return v;
  });
}
function fLeave(){
  if(!ref||!FU||!R)return;try{ref.off()}catch(e){}
  if((R.status==='play'||R.status==='tie')&&oid)ref.transaction(v=>{if(!v||(v.status!=='play'&&v.status!=='tie'))return;if(v.status==='tie'){v.pot=v.carry||0;v.start=Date.now()}v.status='end';v.winner=oid;v.quit=FU.uid;return v});
  else if(R.status==='wait')ref.remove().catch(()=>{});
  else ref.child('players/'+FU.uid).remove().then(()=>ref.child('status').set('wait')).catch(()=>{});
}
$('back').addEventListener('click',fLeave);   // 68번: 카톡으로 친구 부르러 갔다 오면 방이 지워지던 것 고침 (돌아가기를 눌러야만 나가요)

let jN=0;function joinChk(n){if(jN&&n>jN){try{const A=new(window.AudioContext||window.webkitAudioContext)(),t=A.currentTime;[[784,0],[622,.35]].forEach(([f,d])=>{const o=A.createOscillator(),g=A.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.4,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.7);o.connect(g);g.connect(A.destination);o.start(t+d);o.stop(t+d+.75)});setTimeout(()=>A.close(),1600)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}jN=n}
